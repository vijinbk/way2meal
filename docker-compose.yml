services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: way2meal
      POSTGRES_PASSWORD: way2meal
      POSTGRES_DB: way2meal
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U way2meal']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: way2meal
      MINIO_ROOT_PASSWORD: way2meal-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
