name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json#packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      # Catches Next.js prerender errors and Metro resolution problems that type-checking can't.
      - name: Build (API, shared, admin)
        run: pnpm build

      - name: Bundle mobile app (Android JS)
        run: pnpm --filter @way2meal/mobile bundle:android

      # Unit + integration (integration uses Testcontainers; Docker is available on ubuntu-latest).
      - name: Test
        run: pnpm test
